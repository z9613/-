<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系统已锁定</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-image: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=1600&q=80');
            background-size: cover;
            background-position: center;
        }
        .apple-glass {
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            background-color: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.15);
        }
        /* 拟真苹果输入框摇晃动画 */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }
        .shake {
            animation: shake 0.4s ease-in-out;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 select-none overflow-hidden relative">

    <div class="absolute inset-0 bg-black/20 -z-10"></div>

    <div id="lock-container" class="w-full max-w-sm apple-glass rounded-[32px] p-8 text-center text-white transition-all duration-500 scale-100 opacity-100">
        
        <div class="relative w-20 h-20 mx-auto mb-6 flex items-center justify-center bg-white/10 rounded-full border border-white/20 shadow-inner">
            <i data-lucide="lock" id="lock-icon" class="w-8 h-8 text-white/90 transition-transform duration-300"></i>
        </div>

        <h1 class="text-xl font-semibold tracking-tight mb-1">管理员认证</h1>
        <p class="text-xs text-white/60 mb-8 tracking-wide">请输入密码以访问私有工作台</p>

        <form id="login-form" onsubmit="verifyPassword(event)" class="space-y-4">
            <div class="relative flex items-center">
                <input type="password" id="password-input" placeholder="输入访问密码" autocomplete="current-password"
                    class="w-full bg-black/15 hover:bg-black/20 focus:bg-black/25 border border-white/10 focus:border-white/30 rounded-2xl px-4 py-3.5 text-sm text-center text-white placeholder-white/40 focus:outline-none transition duration-200 tracking-widest">
            </div>

            <div id="error-msg" class="text-xs text-rose-300 font-medium opacity-0 transition-opacity duration-200 h-4">
                密码错误，请重新输入
            </div>

            <button type="submit" 
                class="w-full bg-white hover:bg-opacity-90 active:scale-[0.99] text-slate-900 text-sm font-semibold py-3.5 rounded-2xl transition duration-200 shadow-lg flex items-center justify-center gap-1.5">
                <span>解 锁</span>
                <i data-lucide="arrow-right" class="w-4 h-4"></i>
            </button>
        </form>
    </div>

    <div class="absolute bottom-6 text-[10px] text-white/40 font-medium tracking-wider">
        <i data-lucide="shield-check" class="w-3.5 h-3.5 inline mr-1 -mt-0.5"></i> 端对端加密保护
    </div>

    <script>
        // 初始化图标
        lucide.createIcons();

        // 自动聚焦输入框
        document.getElementById('password-input').focus();

        // ----------------------------------------------------
        // 安全配置核心区
        // ----------------------------------------------------
        // 1. 请在此处修改你的专属访问密码
        const CORRECT_PASSWORD = "你的密码"; 

        // 2. 使用相对路径强制浏览器在当前 dashboard 文件夹下寻找 content.html
        const TARGET_PAGE = "./content.html";
        // ----------------------------------------------------

        function verifyPassword(e) {
            e.preventDefault();
            
            const inputField = document.getElementById('password-input');
            const container = document.getElementById('lock-container');
            const errorMsg = document.getElementById('error-msg');
            const lockIcon = document.getElementById('lock-icon');
            const password = inputField.value;

            if (password === CORRECT_PASSWORD) {
                // 1. 验证成功：切换成功视觉状态
                errorMsg.style.opacity = '0';
                lockIcon.style.transform = 'rotate(-15deg) scale(0.9)';
                
                // 2. 动效流转：出场动画
                container.classList.remove('scale-100', 'opacity-100');
                container.classList.add('scale-95', 'opacity-0');

                // 3. 将口令无感存入会话（Session），供内页安全校验，防止绕过
                sessionStorage.setItem('workbench_auth_token', btoa(password));

                // 4. 计算并输出目标绝对 URL 以便控制台调试路径问题
                const targetUrl = new URL(TARGET_PAGE, window.location.href).href;
                console.log("🔑 密码验证成功！正在跳转至: ", targetUrl);

                // 5. 平滑跳转到真正有内容的备忘页面
                setTimeout(() => {
                    window.location.href = TARGET_PAGE;
                }, 400);

            } else {
                // 验证失败：触发苹果经典的输入框摇晃动效
                errorMsg.style.opacity = '1';
                container.classList.add('shake');
                inputField.value = '';
                inputField.focus();

                // 动画结束后移除类名以便下次触发
                setTimeout(() => {
                    container.classList.remove('shake');
                }, 400);
            }
        }
    </script>
</body>
</html>
